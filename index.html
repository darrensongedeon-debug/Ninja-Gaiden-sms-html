
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,user-scalable=no">

<title>Ninja Gaiden sms</title>

<link rel="stylesheet" href="assets/miracle.css">

<style>
@font-face{
    font-family:'Press Start 2P';
    src:url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:'Press Start 2P',monospace;
}

#holder{
    position:fixed;
    inset:0;
    overflow:hidden;
}

#screen{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:100%;
    height:auto;
    max-width:calc(100vh * (256 / 192));
    max-height:calc(100vw * (192 / 256));
    image-rendering:pixelated;
    z-index:1;
}

#instructions{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    width:100vw;
    height:100vh;

    text-align:center;
    color:#fff;
    background:transparent;

    z-index:99999;
    cursor:pointer;
}

#instructions div{
    pointer-events:none;
    line-height:1.8;
}

#pause_menu{
    margin-top:20px;
    pointer-events:auto;
}

#menu_icon,
#audio_icon,
#fullscreen_button{
    position:fixed;
    z-index:100000;
}

#menu_icon{
    left:10px;
    top:10px;
}

#audio_icon{
    left:10px;
    top:52px;
}

#fullscreen_button{
    right:10px;
    top:10px;

    width:40px;
    height:40px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    background:#222;
    border:2px solid white;

    font-size:20px;
    cursor:pointer;
    user-select:none;

    image-rendering:pixelated;
}
</style>

<script src="assets/sms-min.js"></script>
<script src="assets/main.js"></script>

</head>

<body>

<div id="holder">

<canvas id="screen" width="256" height="192"></canvas>


<div id="instructions" onclick="loadGameFullscreen()">
    <div>
        USE ARROW KEYS or WASD to move / Z to attack / X to jump / T to mute audio / P to pause / R to restart
	
	<br><br> 
      CLICK / TOUCH TO <span id="start_text">START</span>

        <div id="pause_menu" onclick="event.stopPropagation()" style="display:none;">
            <span class="button" onclick="toggleMenu()">RESUME</span>
        </div>
    </div>
</div>


<img src="assets/menu_icon.png" id="menu_icon" class="icon" onclick="toggleMenu()">

<img src="assets/audio_icon.png" id="audio_icon" class="icon" onclick="toggleAudio()">


<div id="fullscreen_button" onclick="toggleFullscreen()">⛶</div>


</div>


<script>

function goFullscreen() {
    const el = document.documentElement;

    if (el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
    } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
        el.msRequestFullscreen();
    }
}


function loadGameFullscreen() {

    const instructions = document.getElementById("instructions");

    if (instructions) {
        instructions.style.display = "none";
    }

    goFullscreen();

    if (typeof loadGame === "function") {
        loadGame();
    }
}


function toggleFullscreen(){

    if (!document.fullscreenElement &&
        !document.webkitFullscreenElement &&
        !document.msFullscreenElement) {

        const el = document.documentElement;

        if (el.requestFullscreen) {
            el.requestFullscreen();
        } else if (el.webkitRequestFullscreen) {
            el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
            el.msRequestFullscreen();
        }

    } else {

        if (document.exitFullscreen) {
            document.exitFullscreen();

        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();

        } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
        }
    }
}

</script>

</body>
</html>
